[project]
name = "deepak-backend"
version = "0.1.0"
description = "D.E.E.P.A.K. - Distributed Environment for Extrapolating Probability and Artificial Knowledge"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "D.E.E.P.A.K. Team" }
]

dependencies = [
    # Core Framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",

    # Anthropic Claude
    "anthropic>=0.52.0",

    # Zep Cloud
    "zep-cloud==3.13.0",

    # OASIS Social Simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",

    # File Processing
    "PyMuPDF>=1.24.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
